<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실습 1 · 단계별 재질 만들기</title><link rel="stylesheet" href="demo.css"><style>
.wrap{grid-template-columns:minmax(0,1fr) 20rem;height:100vh;height:100dvh}.stage{position:relative;display:block;min-height:320px}.stage canvas{position:absolute;inset:0;width:100%;height:100%;max-height:none;max-width:none;touch-action:none}.labels{position:absolute;inset:0;display:grid;pointer-events:none}.labels span{padding:9px;font-size:12px;border:1px solid var(--d-line);color:var(--d-ink)}.labels b{background:var(--d-bg);padding:3px 5px;border-radius:4px}#status{font-size:12px}.ctl.unavailable{opacity:.45}.ctl.unavailable input,.ctl.unavailable select{cursor:not-allowed}button{padding:8px}.gallery-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.gallery-grid button{padding:2px;border:1px solid var(--d-line);background:var(--d-bg);color:var(--d-ink);cursor:zoom-in;font-size:10px;line-height:1.2}.gallery-grid img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.gallery-grid span{display:block;padding:3px}#texture-dialog{border:1px solid var(--d-line-strong);border-radius:8px;max-width:min(90vw,700px);background:var(--d-bg);color:var(--d-ink)}#texture-dialog img{display:block;max-width:100%;max-height:70vh;margin:auto} @media(max-width:800px){.wrap{display:block;height:auto}.stage{height:80vh;height:80dvh;min-height:420px}.panel{max-height:none}}
</style></head><body><div class="wrap"><div class="stage"><canvas id="cv" aria-label="드래그로 회전하고 휠로 확대하는 3D 재질 비교" tabindex="0"></canvas><div class="labels" id="labels"></div></div><aside class="panel"><h1>실습 1 · 단계별 재질 만들기</h1><p class="sub">회색 큐브에서 시작해 task1.js의 TODO 1~5를 직접 채우세요. 드래그: 회전 · 휠: 확대</p><div id="ui"></div><button id="reset">시점 초기화</button><p id="status" role="status">텍스처 로딩 중…</p><p class="note" id="note"></p><p>텍스처: Poly Haven · CC0<br>환경 반사는 축소한 LDR 이미지와 일반 밉맵을 이용한 교육용 근사입니다. GGX 환경광 적분(IBL)은 생략합니다.</p></aside></div><script src="demo.js"></script><script src="task1.js"></script></body></html>
